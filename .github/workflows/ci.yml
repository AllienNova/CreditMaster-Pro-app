name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Mock-data scan (report only, TASK-PRE-05)
        continue-on-error: true
        run: |
          rg -n 'Math\.random\(|faker\.|mockData|MOCK_' src/ --glob '!**/__tests__/**' --glob '!**/*.test.*' || true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const pass = coverage.total.lines.pct >= 80;
            const body = [
              '## Test Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Lines | ${coverage.total.lines.pct}% |`,
              `| Statements | ${coverage.total.statements.pct}% |`,
              `| Functions | ${coverage.total.functions.pct}% |`,
              `| Branches | ${coverage.total.branches.pct}% |`,
              '',
              pass ? '✅ Coverage meets 80% threshold' : '⚠️ Coverage below 80% threshold',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  auth-gates:
    name: Auth Gates (FND-001 regression guard)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # BLOCKING: every API route must be classified + guarded in the SEC-signed
      # auth-route-inventory.csv (scripts/verify-auth-coverage.ts) - catches an
      # FND-001-class unguarded/under-authorized route before merge.
      - name: audit:auth - every route classified & guarded (must stay 295/295)
        run: npm run audit:auth

      # BLOCKING: negative-auth suite must not regress (>=568; 611 at last run).
      - name: test:auth-negative - 401/403 coverage across wrapped routes
        run: npm run test:auth-negative

      # BLOCKING: the service-role client BYPASSES RLS, so on every table these
      # services touch the .eq("user_id", ...) filter is load-bearing, not
      # defensive - dropping it returns every user's rows with no error
      # (FND-030). Fails on any unscoped non-insert query. A deliberately
      # cross-user query opts out at the call site with
      # `// idor-audit: cross-user - <reason>`, which is visible in review.
      # Derives its table list from supabase/migrations, so it needs no
      # database and runs here without a Postgres service container.
      - name: audit:idor - service-role queries must be owner-scoped
        run: npm run audit:idor

      # BLOCKING: FND-024 sent dollars into Stripe's integer-cents field - a $50
      # payout moved 50 cents. Every Stripe amount must derive from @/lib/money
      # or carry a justification marker. Self-tests its own detector first.
      - name: audit:money - Stripe amounts must be integer cents
        run: npm run audit:money

      # BLOCKING: FND-049..053 returned Math.random() and hardcoded mock objects
      # to real users as their own financial data. Fails on fabrication in a
      # response path, or a catch returning a payload with no failure signal.
      - name: audit:mocks - no fabricated data in an API response
        run: npm run audit:mocks

      # BLOCKING: a link pointing at a route that does not exist is a 404 for a
      # real user. The dogfood sweep enumerates routes from the filesystem and
      # cannot find these - the bad link is never in its input.
      - name: audit:links (web) - every internal link resolves
        run: npm run audit:links

      # BLOCKING: the inverse of audit:links. A page with no link pointing AT
      # it is invisible to a user no matter how well it renders - 165 of 204
      # pages were in that state because no navigation was mounted at all.
      - name: audit:reachability - every page is reachable by clicking
        run: npm run audit:reachability

      - name: audit:links (mobile) - every internal link resolves
        working-directory: mobile-app
        run: npm run audit:links

      # BLOCKING: the mobile client and the web API drifted apart - 88 of the
      # app's API calls hit 404 while the route sweep was green, because every
      # screen catches the error and renders an empty state.
      - name: audit:api (mobile) - every API call has a backing route
        working-directory: mobile-app
        run: npm run audit:api

  # audit:cascade is NOT wired here yet, deliberately and visibly. It needs a
  # live Postgres to read the erasure function body, and it currently calls
  # process.exit(0) when the database is unreachable - so adding it as-is would
  # make it green by absence on every runner. That is worse than absent: it
  # would read as GDPR Art. 17 coverage while proving nothing. It needs a --ci
  # flag making DB-unreachable a failure, plus a Postgres service container,
  # before it can block a merge honestly.
  #
  # audit:bundle is likewise absent: it runs a full `expo export`, which belongs
  # in its own job with the mobile toolchain rather than a step in this one.

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security, auth-gates]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          AIML_API_KEY: ${{ secrets.AIML_API_KEY || 'placeholder-api-key' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          record: false
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          AIML_API_KEY: ${{ secrets.AIML_API_KEY || 'placeholder-api-key' }}

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/

  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: cd mobile-app && npm ci

      - name: TypeScript type check
        run: cd mobile-app && npm run type-check

      - name: Run mobile tests with coverage
        run: cd mobile-app && npm test -- --coverage --ci
        env:
          CI: true

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}
